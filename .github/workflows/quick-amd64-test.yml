name: Quick AMD64 Test Build (frontend only)
run-name: Quick AMD64 Test Build (frontend only)

# This workflow exists to support fast iteration testing on a self-hosted
# instance during development. It builds ONLY the frontend, ONLY for amd64,
# skipping the QEMU-emulated arm64 cross-build which can take >2h on free
# GitHub runners. The upstream ghcr.yml workflow remains unchanged and is
# what should be used for proper multi-arch publishing.
#
# Triggered manually via:
#   gh workflow run quick-amd64-test.yml --ref <branch>

on:
  workflow_dispatch:

env:
  DOCKER_USER: 1001:127
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push-frontend-amd64:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile
          target: frontend-production
          platforms: linux/amd64
          build-args: |
            DOCKER_USER=${{ env.DOCKER_USER }}
            PUBLISH_AS_MIT=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
